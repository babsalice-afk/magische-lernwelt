name: Build Fire APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-fire-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Magische-Lernwelt-Fire-HD8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Magische-Lernwelt-Fire-HD8
          path: Magische-Lernwelt-Fire-HD8.apk
          retention-days: 30
      - name: Publish public APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fire-latest
          name: Magische Lernwelt – Fire HD 8
          files: Magische-Lernwelt-Fire-HD8.apk
          body: Installationsdatei für das Fire HD 8.
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
